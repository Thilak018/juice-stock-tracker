<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Cue N Console Arena - Juice Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body class="login-page">
  <main class="login-wrap container">
    <div class="row justify-content-center">
      <div class="col-11 col-sm-8 col-md-6 col-lg-4">
        <div class="login-card panel-neon p-4 p-md-5">
          <div class="text-center mb-4">
            <div class="login-emoji" aria-hidden="true">🍹</div>
            <h1 class="brand-title h3 mb-0">CUE N CONSOLE</h1>
            <div class="brand-arena">ARENA</div>
            <p class="text-gold fw-semibold mt-2 mb-0">Juice Stock &amp; Sales Tracker</p>
            <small class="text-muted-soft">Track • Manage • Grow</small>
          </div>

          <div id="loginError" class="alert alert-danger py-2 d-none" role="alert"></div>

          <form id="loginForm" novalidate>
            <div class="mb-3">
              <label for="username" class="form-label">Username</label>
              <input type="text" class="form-control" id="username" autocomplete="username" required autofocus>
              <div class="invalid-feedback">Please enter your username.</div>
            </div>
            <div class="mb-4">
              <label for="password" class="form-label">Password</label>
              <div class="input-group has-validation">
                <input type="password" class="form-control" id="password" autocomplete="current-password" required>
                <button class="btn btn-outline-light" type="button" id="togglePw" aria-label="Show password">👁</button>
                <div class="invalid-feedback">Please enter your password.</div>
              </div>
            </div>
            <button type="submit" class="btn btn-gold w-100 fw-bold" id="loginBtn">
              <span class="spinner-border spinner-border-sm d-none me-2" id="loginSpin"></span>Login
            </button>
          </form>
        </div>
        <p class="text-center text-muted-soft small mt-3">Keep your juice stock well managed for more happy customers!</p>
      </div>
    </div>
  </main>
  <script src="/js/login.js"></script>
</body>
</html>
